services:
  - type: web
    name: rpweb
    env: node
    buildCommand: npm install && npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rpweb-db
          property: connectionString
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: rpweb-db
    databaseName: rpweb
    user: rpweb_user
    plan: free
