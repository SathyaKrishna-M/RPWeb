services:
  - type: web
    name: rpweb
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rpweb-db
          property: connectionString
      - key: NEXTAUTH_URL
        # Set this manually in the Render dashboard to your deployed URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true

  - type: psql
    name: rpweb-db
    plan: free
    postgresMajorVersion: 15
