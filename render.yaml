# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This blueprint deliberately does NOT provision a Render PostgreSQL database.
# Render's free Postgres expires 30 days after creation and is then deleted with
# no backups, which is how the first version of this app lost its data.
#
# The database lives on Neon's free plan instead (see DEPLOYMENT.md). Set
# DATABASE_URL in the Render dashboard to the Neon connection string.

services:
  - type: web
    name: rpweb
    runtime: node
    plan: free
    # --include=dev is explicit because NODE_ENV=production is set below, and
    # npm can take that as a signal to skip devDependencies — which is where
    # typescript, tailwind and the prisma CLI live. Without them the build fails.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Neon connection string. Set this by hand in the Render dashboard;
      # `sync: false` keeps it out of the repo.
      - key: DATABASE_URL
        sync: false
      # Auth.js refuses to run behind a proxy it does not trust. Render
      # terminates TLS in front of the app, so the host must be trusted —
      # without this, every sign-in fails with `UntrustedHost`.
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      # Optional: only needed for a custom domain. Leave unset and Auth.js
      # derives the origin from the request.
      - key: NEXTAUTH_URL
        sync: false
